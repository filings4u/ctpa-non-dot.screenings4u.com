<!doctype html>
<html lang="en" class="s4u-auth-pending">
<head><link rel="icon" href="images/fav.png" type="image/png">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#102f55">
  
  <title>Choose Your C/TPA Account</title>
  <link rel="stylesheet" href="/assets/css/portal.css?v=20261005-nondot6">
  <script src="/assets/js/config.js?v=20261005-nondot6"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/dialogs.js?v=20261005-nondot6"></script>
  <style>
    .workspace-page{min-height:100vh;background:linear-gradient(135deg,#0b2747,#174e80);padding:36px 18px}
    .workspace-shell{width:min(1120px,100%);margin:0 auto}
    .workspace-brand{display:flex;justify-content:center;margin-bottom:18px}.workspace-brand img{width:255px;max-width:75vw}
    .workspace-panel{background:#fff;border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.25);overflow:hidden}
    .workspace-head{padding:30px 30px 22px;text-align:center;border-bottom:1px solid #e4ebf3}
    .workspace-kicker{font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#f97300;margin-bottom:8px}
    .workspace-head h1{margin:0;color:#102f55;font-size:28px}.workspace-head p{margin:8px auto 0;max-width:700px;color:#65788f;font-size:13px;line-height:1.6}
    .workspace-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding:24px 30px 30px}
    .workspace-card{border:1px solid #d8e3ef;border-radius:15px;padding:20px;background:#fff;display:flex;flex-direction:column;gap:14px;min-height:235px;transition:.18s ease;box-shadow:0 8px 24px rgba(16,47,85,.05)}
    .workspace-card:hover{transform:translateY(-2px);border-color:#f97300;box-shadow:0 14px 30px rgba(16,47,85,.11)}
    .workspace-card-top{display:flex;align-items:flex-start;gap:12px}.workspace-mark{width:44px;height:44px;border-radius:12px;background:#fff3e8;color:#f97300;display:grid;place-items:center;font-weight:900;font-size:15px;flex:0 0 auto}
    .workspace-card h2{margin:0;color:#102f55;font-size:17px}.workspace-plan{margin-top:4px;color:#51677e;font-size:12px}.workspace-powered{margin-top:5px;color:#7a8797;font-size:10px;font-weight:700}.workspace-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:2px}
    .workspace-meta div{background:#f5f8fc;border-radius:10px;padding:10px}.workspace-meta span{display:block;font-size:9px;font-weight:850;text-transform:uppercase;letter-spacing:.08em;color:#7b8da1;margin-bottom:4px}.workspace-meta strong{font-size:11px;color:#17365f;text-transform:capitalize;word-break:break-word}
    .workspace-enter{margin-top:auto;width:100%;border:0;border-radius:10px;background:#f97300;color:white;font-weight:850;padding:12px 15px;cursor:pointer;font-size:12px}.workspace-enter:hover{background:#e86600}.workspace-enter:disabled{opacity:.55;cursor:wait}
    .workspace-empty{grid-column:1/-1;text-align:center;padding:34px;color:#65788f}.workspace-actions{padding:0 30px 28px;text-align:center}.workspace-actions button{border:0;background:transparent;color:#58708a;text-decoration:underline;cursor:pointer;font-size:11px}
    .workspace-msg{margin-top:12px;font-size:12px!important}.workspace-msg.error{color:#b42318}.workspace-msg.ok{color:#18794e}
    @media(max-width:760px){.workspace-page{padding:22px 12px}.workspace-head{padding:25px 18px 18px}.workspace-head h1{font-size:23px}.workspace-grid{grid-template-columns:1fr;padding:18px;gap:13px}.workspace-meta{grid-template-columns:1fr}.workspace-actions{padding:0 18px 22px}}
  </style>
</head>
<body class="workspace-page loading">
  <main class="workspace-shell">
    <div class="workspace-brand"><img src="images/workforce-workplace2.png?v=20261005-nondot6" alt="Workforce NON DOT"></div>
    <section class="workspace-panel" aria-labelledby="workspaceTitle">
      <header class="workspace-head">
        <div class="workspace-kicker">C/TPA Workplace Portal</div>
        <h1 id="workspaceTitle">Choose your C/TPA account</h1>
        <p>Select the C/TPA account you want to manage in this portal.</p>
        <p id="msg" class="workspace-msg">Loading your C/TPA accounts…</p>
      </header>
      <div id="choices" class="workspace-grid" aria-live="polite"></div>
      <div class="workspace-actions"><button type="button" id="signOutAll">Not your account? Sign out</button></div>
    </section>
  </main>
  <script src="/assets/js/workspace.js?v=20261005-nondot6"></script>
  <script src="/assets/js/validation.js?v=20261005-nondot6"></script>
</body>
</html>
